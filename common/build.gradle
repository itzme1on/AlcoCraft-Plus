plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

repositories {
    mavenCentral()
    maven { url = "https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.fabricmc.net/" } // Required for Fabric Loom dependencies like Yarn
}

dependencies {
    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${project.rei_version}"
    api "org.apache.logging.log4j:log4j-api:2.24.3"
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
}