modLoader = "javafml"
license = "${mod_license}"
loaderVersion = "${forge_loader_version_range}"
displayURL = "${mod_page_url}"
issueTrackerURL = "${mod_issues_url}"
logoFile = "logo.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "alcocraftplus.forge.mixins.json"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "architectury"
mandatory = true
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"
