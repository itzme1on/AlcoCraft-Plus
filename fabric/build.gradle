plugins {
    id 'fabric-loom'
    id 'com.modrinth.minotaur'
    id "me.shedaniel.unified-publishing" // REI publishing
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral() // General repository
    maven { url = "https://maven.fabricmc.net/" } // Fabric Maven repository
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}


tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named("remapJar") {
    archiveClassifier.set("")
}

publishing {
    publications {
        if (!publications.names.contains('mavenJava')) {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
    }
    repositories {
        maven {
            name = "LocalRepo"
            url = layout.buildDirectory.dir("repo").get().asFile.toURI()
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") // Use environment variable for authentication
    projectId = rootProject.mod_modrinth_id    // Modrinth project ID
    versionNumber = project.version        // Mod version
    versionType = "release"                // Change to "beta" or "alpha" if needed
    loaders = ["fabric"]                   // Specify loaders
    gameVersions = [project.minecraft_version] // Minecraft version
    dependencies {
        required.project("fabric-api")
    }
}