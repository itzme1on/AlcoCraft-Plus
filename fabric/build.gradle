plugins {
    id 'fabric-loom' // Use a specific version of Fabric Loom
    id 'com.modrinth.minotaur' // Modrinth publishing plugin
    id "me.shedaniel.unified-publishing" // REI publishing
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral() // General repository
    maven { url = "https://maven.fabricmc.net/" } // Fabric Maven repository
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Example additional mod dependencies
    // modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_version", project.version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "mod_id": rootProject.mod_id,
                "mod_version": project.version
        )
    }
}


tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named("remapJar") {
    archiveClassifier.set("")
}

publishing {
    publications {
        if (!publications.names.contains('mavenJava')) {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
    }
    repositories {
        maven {
            name = "LocalRepo"
            url = uri("file://${buildDir}/repo")
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") // Use environment variable for authentication
    projectId = rootProject.mod_modrinth_id    // Modrinth project ID
    versionNumber = project.version        // Mod version
    versionType = "release"                // Change to "beta" or "alpha" if needed
    loaders = ["fabric"]                   // Specify loaders
    gameVersions = [project.minecraft_version] // Minecraft version
    dependencies {
        required.project("fabric-api") // Add required dependencies for Modrinth
    }
}