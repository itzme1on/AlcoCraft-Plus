plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "me.shedaniel.unified-publishing"
    id 'com.modrinth.minotaur'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modApi "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modApi "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation("com.terraformersmc:modmenu:$rootProject.modmenu_version")

    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    def toJsonArray = { propName ->
        def list = (project.findProperty(propName) ?: "").toString()
                .split(",").collect { it.trim() }.findAll { it }
        groovy.json.JsonOutput.toJson(list)
    }

    filesMatching("fabric.mod.json") {
        expand(
                "mod_authors": toJsonArray("mod_authors"),
                "mod_contributors": toJsonArray("mod_contributors"),
                "mod_discord_url": project.findProperty("mod_discord_url"),
                "mod_description": project.findProperty("mod_description"),
                "mod_display_name": project.findProperty("mod_display_name"),
                "mod_git_url": project.findProperty("mod_git_url"),
                "mod_id": project.findProperty("mod_id"),
                "mod_issues_url": project.findProperty("mod_issues_url"),
                "mod_license": project.findProperty("mod_license"),
                "mod_name": project.findProperty("mod_display_name"),
                "mod_page_url": project.findProperty("mod_page_url"),
                "mod_version": project.findProperty("mod_version")
        )
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = mod_modrinth_id
    versionNumber = mod_version
    versionType = release_channel
    loaders = ["fabric"]
    file = tasks.named("remapJar").get().archiveFile

    if (changelog_file.exists()) {
        changelog = changelog_file.text
    }

    dependencies {
        required.project 'architectury-api'
        required.project 'fabric-api'
        optional.project 'modmenu'
        optional.project 'jei'
    }
}