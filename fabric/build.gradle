plugins {
    id 'fabric-loom' // Use a specific version of Fabric Loom
    id 'com.modrinth.minotaur' // Modrinth publishing plugin
    id "me.shedaniel.unified-publishing" // REI publishing
}

def changelog_file = rootProject.file('CHANGELOG.md')

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' } // Fabric Maven repository
    maven { url = 'https://maven.shedaniel.me/' } // REI Maven repository
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }

    client {
        java {
            srcDir 'src/client/java'
        }
        resources {
            srcDir 'src/client/resources'
        }
    }

    server {
        java {
            srcDir 'src/server/java'
        }
        resources {
            srcDir 'src/server/resources'
        }
    }
}

dependencies {
    // Minecraft Dependency
    minecraft "com.mojang:minecraft:${rootProject.findProperty("minecraft_version")}"

    // Yarn Mappings
    mappings "net.fabricmc:yarn:${rootProject.findProperty("yarn_version")}:v2"

    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.findProperty("fabric_loader_version")}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.findProperty("fabric_api_version")}"

    // Shared "common" project dependency
    implementation project(":common")

    // REI (Roughly Enough Items)
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rootProject.findProperty("rei_version")}"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") // Use environment variable for Modrinth token
    projectId = rootProject.findProperty("mod_modrinth_id") // Modrinth project ID
    versionNumber = rootProject.findProperty("mod_version") // Mod version
    versionType = rootProject.findProperty("release_channel") // Release channel (e.g., beta, release)
    loaders = ["fabric"] // Specify Fabric loader
    file = tasks.named("remapJar").get().archiveFile // Jar file to upload

    if (changelog_file.exists()) {
        changelog = changelog_file.text
    }

    dependencies {
        required.project 'fabric-api' // Fabric API as a required dependency
        optional.project 'modmenu' // Optional ModMenu dependency
        optional.project 'roughly-enough-items' // Optional REI dependency
    }
}

processResources {
    inputs.property 'version', rootProject.findProperty("mod_version") // Inject mod version
    filesMatching("fabric.mod.json") {
        expand project.properties // Expand Gradle properties
    }
}

tasks {
    jar {
        archiveClassifier.set("dev") // Add "dev" classifier to the jar
    }

    remapJar {
        inputFile.set(tasks.named("jar").get().archiveFile) // Use jar as input
        archiveClassifier.set('') // No classifier for remapped jar
    }

    sourcesJar {
        // Include sources from the "common" module
        def commonSources = project(":common").tasks.named("sourcesJar", Jar)
        dependsOn commonSources
        from commonSources.get().archiveFile.map { zipTree(it) }
    }
}