plugins {
    id "dev.architectury.loom"
    id "com.github.johnrengelman.shadow" version '8.1.1'
    id "me.shedaniel.unified-publishing"
    id 'com.modrinth.minotaur'
}

def changelog_file = rootProject.file('CHANGELOG.md')

loom {
    accessWidenerPath = file("../common/src/main/resources/alcocraftplus.accesswidener")
}

repositories {
    mavenCentral()
    maven { url 'https://maven.parchmentmc.org' }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.shedaniel.me/' } // Added repository for RoughlyEnoughItems
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_version}"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation project(":common")
    // REI Dependency (example)
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:18.0.804"
    // Architectury API Dependency
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) {
        transitive = false
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = mod_modrinth_id
    versionNumber = mod_version
    versionType = release_channel
    loaders = ["fabric"]
    file = tasks.named("remapJar").get().archiveFile

    if (changelog_file.exists()) {
        changelog = changelog_file.text
    }

    dependencies {
        required.project 'architectury-api'
        required.project 'fabric-api'
        optional.project 'modmenu'
        optional.project 'roughly-enough-items'
    }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand(
                // Use rootProject properties for clarity if defined globally
                "mod_authors": rootProject.findProperty("mod_authors"),
                "mod_discord_url": rootProject.findProperty("mod_discord_url"),
                "mod_description": rootProject.findProperty("mod_description"),
                "mod_display_name": rootProject.findProperty("mod_display_name"),
                "mod_git_url": rootProject.findProperty("mod_git_url"),
                "mod_id": rootProject.findProperty("mod_id"),
                "mod_issues_url": rootProject.findProperty("mod_issues_url"),
                "mod_license": rootProject.findProperty("mod_license"),
                "mod_name": rootProject.findProperty("mod_display_name"), // Often same as display name
                "mod_page_url": rootProject.findProperty("mod_page_url"),
                // Use the globally defined version property
                "mod_version": rootProject.mod_version
        )
    }
    inputs.property 'version', rootProject.mod_version
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) { variant ->
        skip()
    }
}