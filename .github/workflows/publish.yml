name: Publish

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish"
        type: choice
        options:
          - "26.1"
          - "1.21.11"
          - "1.21.10"
          - "1.21.8"
          - "1.21.6"
          - "1.21.5"
          - "1.21.4"
          - "1.21.1"
          - "1.20.2"
          - "1.20.1"
          - "1.19.2"
        default: "26.1"
      release_channel:
        description: "Release channel"
        type: choice
        options: [release, beta, alpha]
        default: release
      dry_run:
        description: "Dry run (build + resolve tasks, do NOT upload)"
        type: boolean
        default: false
      platform:
        description: "Target platform(s)"
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      loaders:
        description: "Loader(s) to publish (granular: fabric/neoforge on 1.21+/26.1, forge on 1.20.x/1.19.2)"
        type: choice
        options: [both, fabric, neoforge, forge]
        default: both

concurrency:
  group: publish-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Determine Java version from minecraft_version
        id: java
        run: |
          mc=$(grep -E '^[[:space:]]*minecraft_version[[:space:]]*=' gradle.properties | head -1 | cut -d'=' -f2 | tr -d '[:space:]')
          case "$mc" in
            26.*) jv=25 ;;
            1.21*|1.22*) jv=21 ;;
            *) jv=17 ;;
          esac
          echo "Minecraft $mc -> Java $jv"
          echo "version=$jv" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute publish tasks
        id: tasks
        run: |
          if [ "${{ inputs.loaders }}" = "both" ] && [ "${{ inputs.platform }}" = "both" ]; then
            echo "list= publishMod"
            echo "list= publishMod" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ inputs.loaders }}" in
            fabric) projects=":Fabric" ;;
            neoforge) projects=":NeoForge" ;;
            forge) projects=":Forge" ;;
            *) projects=":Fabric :NeoForge" ;;
          esac
          case "${{ inputs.platform }}" in
            modrinth) plats="publishModrinth" ;;
            curseforge) plats="publishCurseforge" ;;
            *) plats="publishModrinth publishCurseforge" ;;
          esac
          tasks=""
          for p in $projects; do for t in $plats; do tasks="$tasks $p:$t"; done; done
          echo "Publish tasks:$tasks"
          echo "list=$tasks" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        run: ./gradlew build${{ steps.tasks.outputs.list }} -Prelease_channel=${{ inputs.release_channel }} ${{ inputs.dry_run && '--dry-run' || '' }} --stacktrace
        env:
          MODRINTH_TOKEN: ${{ inputs.platform != 'curseforge' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ inputs.platform != 'modrinth' && secrets.CURSEFORGE_TOKEN || '' }}
