name: Publish

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        type: choice
        options: [release, beta, alpha]
        default: release
      dry_run:
        description: "Dry run (build + resolve tasks, do NOT upload)"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Java version from minecraft_version
        id: java
        run: |
          mc=$(grep -E '^[[:space:]]*minecraft_version[[:space:]]*=' gradle.properties | head -1 | cut -d'=' -f2 | tr -d '[:space:]')
          case "$mc" in
            1.21*|1.22*) jv=21 ;;
            *) jv=17 ;;
          esac
          echo "Minecraft $mc -> Java $jv"
          echo "version=$jv" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and publish
        run: ./gradlew build publishMod -Prelease_channel=${{ inputs.release_channel }} ${{ inputs.dry_run && '--dry-run' || '' }} --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
