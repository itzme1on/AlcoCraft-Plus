pluginManagement {
    repositories {
        // General plugin repositories
        mavenCentral()
        gradlePluginPortal()

        // Loader-specific repositories
        maven { url = "https://maven.fabricmc.net/" } // Fabric dependencies
        maven { url = "https://maven.neoforged.net/releases/" } // NeoForge dependencies
        maven { url = "https://maven.shedaniel.me/" } // Shedaniel libraries (e.g., REI)
    }
    plugins {
        id 'java'

        // Fabric Loom for Fabric-specific builds
        id 'fabric-loom' version '1.10.5'

        // NeoGradle (NeoForge) for Forge-specific builds
        id 'net.neoforged.gradle.userdev' version '7.0.184'

        // Other general plugins
        id 'com.gradleup.shadow' version '8.3.5'
        id 'com.modrinth.minotaur' version '2.+' // Modrinth publishing
        id 'me.shedaniel.unified-publishing' version '0.1.+' // REI publishing
    }
}

plugins {
    id("org.gradle.toolchains.foojay-resolver") version "0.10.0"
}

toolchainManagement {
    jvm {
        javaRepositories {
            repository("foojay") {
                resolverClass = org.gradle.toolchains.foojay.FoojayToolchainResolver
            }
        }
    }
}

// Root project name
rootProject.name = 'alcocraftplus'

// Include the subprojects
include('common')
include('fabric')
include('neoforge')

// Centralized dependency repositories
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral() // General Maven repository

        // Loader-specific repositories
        maven { url = "https://maven.fabricmc.net/" } // Fabric dependencies
        maven { url = "https://maven.neoforged.net/releases/" } // NeoForge dependencies
        maven { url = "https://maven.shedaniel.me/" } // Shedaniel libraries (e.g., REI)
        maven { url = "https://maven.terraformersmc.com/releases/" } // ModMenu, etc.

        // Additional common repositories
        maven { url = "https://jitpack.io" } // JitPack for libraries
        maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://repo.spongepowered.org/repository/snapshots/" }
    }
}