pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal() // Standard Gradle plugins
        maven { url = "https://maven.architectury.dev/" } // Architectury plugins (loom, architectury-plugin)
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
    }
    plugins {
        // Declare versions for plugins applied by ID in buildscripts
        id 'dev.architectury.loom' version '1.10-SNAPSHOT'
        id 'architectury-plugin' version '3.3.115'
        id 'com.github.johnrengelman.shadow' version '8.1.1'
        id 'com.modrinth.minotaur' version '2.+' // Example
        id 'me.shedaniel.unified-publishing' version '0.1.+' // Example
    }


}

plugins {
    // Apply settings plugins like toolchain management
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'alcocraftplus' // Or your desired root project name

// Include the subprojects
include('common')
include('fabric')
include('neoforge')

// Centralized dependency repositories
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = "https://maven.neoforged.net/releases/" } // Required for NeoForge
        mavenCentral()
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.fabricmc.net/" } // Fabric dependencies
        maven { url = "https://maven.terraformersmc.com/releases/" } // ModMenu, etc.
        maven { url = "https://jitpack.io" } // Common for libraries
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://repo.spongepowered.org/repository/snapshots/" }
    }
}